<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento aprovado — Tiago Lobo Store</title>
  <meta name="robots" content="noindex">

  <!-- Import Map: mapeia @supabase/supabase-js para a CDN ESM -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0a0a0a;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 460px;
      padding: 30px;
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: rgba(255,255,255,0.7);
      margin: 0 0 18px;
      line-height: 1.5;
    }

    #orderInfo {
      margin: 18px 0 24px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      text-align: left;
    }

    #orderInfo p {
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Pagamento aprovado</h1>
    <p>Seu pedido foi recebido e estamos preparando os próximos passos.</p>
    <div id="orderInfo"></div>
    <button type="button" onclick="window.location.href='/'">Voltar para a loja</button>
  </div>

  <script type="module">
    import { createClient } from "@supabase/supabase-js";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./js/config.js";

    // Limpa carrinho ao chegar nesta página
    localStorage.removeItem("tl_cart_v1");

    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function carregarPedido() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get("external_reference");
      const orderInfo = document.getElementById("orderInfo");

      if (!orderInfo) return;

      if (!ref) {
        orderInfo.innerHTML = "<p>Pedido não localizado.</p>";
        return;
      }

      const { data: order, error } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("external_reference", ref)
        .maybeSingle();

      if (error || !order) {
        orderInfo.innerHTML = "<p>Não foi possível carregar os dados do pedido.</p>";
        return;
      }

      const total = Number(order.total || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

      orderInfo.innerHTML = `
        <p><strong>Pedido:</strong> ${order.external_reference}</p>
        <p><strong>Status:</strong> ${order.status}</p>
        <p><strong>Total:</strong> ${total}</p>
      `;
    }

    carregarPedido();
  </script>
</body>
</html>
