<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento aprovado — Tiago Lobo Store</title>
  <meta name="robots" content="noindex">


  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0a0a0a;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 460px;
      padding: 30px;
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: rgba(255,255,255,0.7);
      margin: 0 0 18px;
      line-height: 1.5;
    }

    #orderInfo {
      margin: 18px 0 24px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      text-align: left;
    }

    #orderInfo p {
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Pagamento aprovado</h1>
    <p>Seu pedido foi recebido e estamos preparando os próximos passos.</p>
    <div id="orderInfo"></div>
    <button type="button" onclick="window.location.href='/'">Voltar para a loja</button>
  </div>

  <script>
    async function carregarPedido() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get("external_reference");
      const orderInfo = document.getElementById("orderInfo");

      if (!orderInfo) return;

      if (!ref) {
        orderInfo.innerHTML = "<p>Pedido não localizado.</p>";
        return;
      }

      try {
        const res = await fetch(`/api/order-status?ref=${encodeURIComponent(ref)}`);

        if (!res.ok) {
          orderInfo.innerHTML = "<p>Não foi possível carregar os dados do pedido.</p>";
          return;
        }

        const order = await res.json();

        // Só limpa o carrinho se o pagamento foi realmente confirmado
        if (order.status === "approved" || order.status === "paid") {
          localStorage.removeItem("tl_cart_v1");
          localStorage.removeItem("tl_cart_v2");
        }

        const statusLabel = {
          approved: "✅ Pagamento aprovado",
          paid:     "✅ Pago",
          pending:  "⏳ Aguardando pagamento",
          rejected: "❌ Pagamento recusado",
        }[order.status] || order.status;

        const total = Number(order.total || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

        orderInfo.innerHTML = `
          <p><strong>Pedido:</strong> ${order.external_reference}</p>
          <p><strong>Status:</strong> ${statusLabel}</p>
          <p><strong>Total:</strong> ${total}</p>
        `;
      } catch (err) {
        console.error("[sucesso] Erro ao carregar pedido:", err?.message);
        orderInfo.innerHTML = "<p>Não foi possível carregar os dados do pedido.</p>";
      }
    }

    carregarPedido();
  </script>
</body>
</html>
