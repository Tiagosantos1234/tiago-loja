<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Minha Conta</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">
  <div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="app-sidebar">

    <div class="sidebar-user">
      <img id="sidebarAvatar" src="" alt="Avatar do cliente" />
      <h3 id="sidebarName">Cliente</h3>
      <p id="sidebarEmail"></p>
    </div>

    <nav class="sidebar-menu">
      <button type="button" class="active" data-tab="profile" onclick="switchTab('profile')">&#128100; Perfil</button>
      <button type="button" data-tab="address" onclick="switchTab('address')">&#128205; Endere&ccedil;o</button>
      <button type="button" data-tab="orders" onclick="switchTab('orders')">&#128230; Pedidos</button>
    </nav>

  </aside>

  <!-- CONTEUDO -->
  <main class="app-main">

    <!-- PERFIL -->
    <div class="tab-content active" id="profile">
      <div class="card">
        <h3>&#128100; Seus dados</h3>
        <p id="userName"></p>
        <p id="userEmail"></p>
      </div>
    </div>

    <!-- ENDERECO -->
    <div class="tab-content" id="address">
      <div class="card">
        <h3>&#128205; Endere&ccedil;o</h3>

        <input id="cep" placeholder="CEP" autocomplete="postal-code" />
        <input id="street" placeholder="Rua" autocomplete="address-line1" />
        <input id="number" placeholder="N&uacute;mero" autocomplete="address-line2" />
        <input id="city" placeholder="Cidade" autocomplete="address-level2" />
        <input id="state" placeholder="Estado" autocomplete="address-level1" />

        <button type="button" onclick="saveProfile()" class="primary-btn">
          Salvar
        </button>
      </div>
    </div>

    <!-- PEDIDOS -->
    <div class="tab-content" id="orders">
      <div class="card orders-card">
        <h3>&#128230; Meus pedidos</h3>
        <div id="ordersList"></div>
      </div>
    </div>

  </main>

</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/header.js"></script>
  <script src="./js/script.js"></script>
</body>
