<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Minha Conta — Tiago Lobo Store</title>
  <meta name="description" content="Gerencie seus dados, endereço e acompanhe seus pedidos." />
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Import Map: mapeia @supabase/supabase-js para a CDN ESM -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
</head>

<body class="app">
  <div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="app-sidebar">

    <div class="sidebar-user">
      <img id="sidebarAvatar" src="" alt="Avatar do cliente" />
      <h3 id="sidebarName">Cliente</h3>
      <p id="sidebarEmail"></p>
    </div>

    <nav class="sidebar-menu">
      <button type="button" class="active" data-tab="profile" onclick="switchTab('profile')">&#128100; Perfil</button>
      <button type="button" data-tab="address" onclick="switchTab('address')">&#128205; Endereço</button>
      <button type="button" data-tab="orders" onclick="switchTab('orders')">&#128230; Pedidos</button>
    </nav>

  </aside>

  <!-- CONTEUDO -->
  <main class="app-main">

    <!-- PERFIL -->
    <div class="tab-content active" id="profile">
      <div class="card">
        <h3>&#128100; Seus dados</h3>
        <p id="userName"></p>
        <p id="userEmail"></p>
      </div>
    </div>

    <!-- ENDERECO -->
    <div class="tab-content" id="address">
      <div class="card">
        <h3>&#128205; Endereço</h3>

        <input id="cep" placeholder="CEP" autocomplete="postal-code" />
        <input id="street" placeholder="Rua" autocomplete="address-line1" />
        <input id="number" placeholder="Número" autocomplete="address-line2" />
        <input id="city" placeholder="Cidade" autocomplete="address-level2" />
        <input id="state" placeholder="Estado" autocomplete="address-level1" />

        <button type="button" onclick="saveProfile()" class="primary-btn">
          Salvar
        </button>
      </div>
    </div>

    <!-- PEDIDOS -->
    <div class="tab-content" id="orders">
      <div class="card orders-card">
        <h3>&#128230; Meus pedidos</h3>
        <div id="ordersList"></div>
      </div>
    </div>

  </main>

</div>

  <div class="toast" id="toast"></div>

  <script src="./js/header.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
