<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app">

<div class="app-container">

  <!-- HEADER -->
  <div class="app-header">
    <div>
      <h2 id="userName">Olá, Cliente</h2>
      <p id="userEmail"></p>
    </div>
    <button onclick="logout()" class="logout-btn">Sair</button>
  </div>

  <!-- TABS -->
  <div class="app-tabs">
    <button class="tab active" data-tab="profile">Perfil</button>
    <button class="tab" data-tab="address">Endereço</button>
    <button class="tab" data-tab="orders">Pedidos</button>
  </div>

  <!-- CONTENT -->
  <div class="app-content">

    <!-- PERFIL -->
    <div class="tab-content active" id="profile">
      <div class="card">
        <h3>👤 Seus dados</h3>
        <p id="userName"></p>
        <p id="userEmail"></p>
      </div>
    </div>

    <!-- ENDEREÇO -->
    <div class="tab-content" id="address">
      <div class="card">
        <h3>📍 Endereço</h3>

        <input id="cep" placeholder="CEP" />
        <input id="street" placeholder="Rua" />
        <input id="number" placeholder="Número" />
        <input id="city" placeholder="Cidade" />
        <input id="state" placeholder="Estado" />

        <button onclick="saveProfile()" class="primary-btn">
          Salvar
        </button>
      </div>
    </div>

    <!-- PEDIDOS -->
    <div class="tab-content" id="orders">
      <div class="card">
        <h3>📦 Meus pedidos</h3>
        <div id="ordersList"></div>
      </div>
    </div>

  </div>

</div>

<script src="./js/script.js"></script>
</body>
