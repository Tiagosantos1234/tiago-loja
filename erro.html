<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pagamento não concluído</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      background:#0a0a0a;
      color:#fff;
      font-family: Arial, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
    }

    .box{
      max-width:420px;
      padding:30px;
      border-radius:24px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
    }

    h1{
      font-size:24px;
      margin-bottom:10px;
    }

    p{
      color:rgba(255,255,255,0.6);
      margin-bottom:20px;
    }

    button{
      height:50px;
      border-radius:999px;
      border:none;
      background:#fff;
      color:#000;
      cursor:pointer;
      width:100%;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Pagamento não concluído ❌</h1>
  <p>Algo deu errado ou o pagamento foi cancelado.</p>

  <button onclick="window.location.href='/'">
    Tentar novamente
  </button>
</div>

</body>
</html>
